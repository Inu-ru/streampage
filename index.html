<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>いぬーる ～ラジオのようなゲーム配信～</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d2d;
      --text-main: #f0f2f8;
      --text-muted: #9ba1b0;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --sub-accent: #3742fa;
      --border-color: #2c3149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ヘッダー */
    header {
      background: rgba(15, 17, 26, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .logo .sub-tagline {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .nav-links {
      display: flex;
      gap: 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .nav-links a:hover {
      color: var(--accent);
      transition: 0.2s;
    }

    /* ヒーローセクション */
    .hero {
      text-align: center;
      padding: 5rem 1.5rem 4rem;
      background: radial-gradient(circle at top, #1f243d 0%, var(--bg-color) 70%);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--sub-accent));
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(255, 71, 87, 0.4);
      border: 3px solid #fff;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background-color: var(--accent);
      color: #fff;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.05rem;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
    }

    /* メインコンテンツ共通 */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    section {
      margin-bottom: 4.5rem;
      scroll-margin-top: 80px;
    }

    .section-title {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
      padding-left: 0.8rem;
      border-left: 4px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 配信埋め込みエリア */
    .stream-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .stream-controls {
      margin-top: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      flex: 1;
      min-width: 260px;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .btn-small {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      border: none;
      background: var(--sub-accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-small:hover {
      opacity: 0.9;
    }

    /* 動画・アーカイブ導線グリッド */
    .video-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .video-link-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .video-link-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .video-link-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
    }

    .video-link-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .badge-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* プロフィール & スケジュール グリッド */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.8rem;
    }

    .card h3 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: #fff;
    }

    .profile-meta {
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .profile-meta strong {
      color: var(--text-main);
    }

    .creator-badge {
      display: inline-block;
      background: rgba(255, 193, 7, 0.15);
      color: #ffd166;
      border: 1px solid rgba(255, 193, 7, 0.35);
      padding: 0.2rem 0.65rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .schedule-list {
      list-style: none;
    }

    .schedule-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border-color);
      font
