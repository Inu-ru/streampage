      font-size: 2rem;
      padding-bottom: 0.65rem;
      border-bottom: 2px solid #ff4757;
      display: inline-block;

    .credit-btn-group {

      gap: 0.75rem;

    .credit-link-btn {

      align-items: center;

      border: 1px solid #3e4566;
      color: #f0f2f8;
      padding: 0.55rem 1.15rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: border-color 0.2s, background-color 0.2s, transform 0.2s;
    }
    .credit-link-btn:hover {

      background: #232842;

    .back-home { text-align: center; margin-top: 2.5rem; }

      gap: 0.5rem;
